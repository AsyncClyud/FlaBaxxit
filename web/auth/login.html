<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login</title>
	<meta name="description" content="Login Page">
	<link rel="icon" type="image/png" href="/static/icons/favicon-96x96.png" sizes="96x96" />
	<link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg" />
	<link rel="shortcut icon" href="/static/icons/favicon.ico" />
	<link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png" />
	<meta name="apple-mobile-web-app-title" content="FlaBaxxit" />
	<link rel="manifest" href="/static/icons/site.webmanifest" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
    @theme {
    --color-clifford: #da373d;
    }
    </style>
    <script src="/static/auth/scripts/login.js"></script>
    <script type="module" src="/static/auth/scripts/is_auth/is_auth.js"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-[100vh] bg-[#212830] grid grid-rows-[auto_1fr_auto] m-[0]">
    <header class="h-[15vh] w-auto bg-[#151b23] text-[white] font-[JetBrains_Mono] row-[1] outline-[2px] outline-solid outline-[#333c46]" id="header">
        <div class="flex flex-row" id="header_content">
            <a class="text-[5vh] text-[#d1d7e0] font-[JetBrains_Mono]" href="/">FlaBaxxit</a> <br>
            <img src="/static/images/1.webp" alt="Logo" width="50">
        </div>
        <a class="bg-[#2a323c] text-[gainsboro] rounded-[3px] p-[5px] m-[5px]" href="/auth/register">Registration</a>
    </header>
    <main class="w-[70vw] grid grid-rows-[auto_auto_auto_auto] text-[#d1d7e0] text-center font-[JetBrains_Mono] m-[10px] mr-auto ml-auto p-6 content-center justify-center justify-items-center" id="main">
        <div class="h-fit w-[45vw] bg-[#212121] p-[10px] outline-[2px] outline-solid outline-[#333c46] rounded-[5px]" id="login">
            <h3 class="text-[3vh] m-[10px]">Username</h3>
            <input class="w-[30vw] bg-[white] text-[black] rounded-[2px]" type="text" placeholder="Username..." id="username"> <br>
            <h3 class="text-[3vh] m-[10px]">Password</h3>
            <input class="w-[30vw] bg-[white] text-[black] rounded-[2px]" type="password" placeholder="Password..." id="password"> <br>
            <button class="w-fit bg-[white] text-[black] text-[JetBrains_Mono] rounded-[3px] m-[10px] p-[5px]" type="button" onclick="SendLoginRequest()">Login</button>
            <p id="status"></p>
            <div class="cf-turnstile" id="turnstile-widget" data-sitekey="0x4AAAAAAD9i83m-xS3y164A" data-theme="dark" data-size="compact"></div>
        </div>
    </main>
    <footer class="h-[10vh] w-auto row-[3] bg-[#212830] text-center font-[JetBrains_Mono]" id="footer">
        <div class="mr-auto flex flex-col">
            <a class="m-[5px] text-[#6f6f76]" href="/privacy">Privacy Policy</a>
            <a class="m-[5px] text-[#6f6f76]" href="/terms">Terms of use</a>
                        <a class="m-[5px] ml-auto mr-auto" href="https://github.com/AsyncClyud/FlaBaxxit-mobile-app/releases/download/alpha/flabaxxit-v1.0.apk"><img src="/static/images/android.svg" alt="Logo"></a>
            <p class="text-[#6f6f76]">&copy; 2026 FlaBaxxit. All copyright reversed.</p>
        </div>
    </footer>

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</body>
</html>
