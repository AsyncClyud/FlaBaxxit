<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Settings</title>
	<meta name="description" content="Settings page">
	<link rel="icon" type="image/png" href="/static/icons/favicon-96x96.png" sizes="96x96" />
	<link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg" />
	<link rel="shortcut icon" href="/static/icons/favicon.ico" />
	<link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png" />
	<meta name="apple-mobile-web-app-title" content="FlaBaxxit" />
	<link rel="manifest" href="/static/icons/site.webmanifest" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
    @theme {
    --color-clifford: #da373d;
    }
    </style>
    <script src="/static/profile/scripts/usermenu/logout.js"></script>
    <script src="/static/profile/scripts/usermenu/usermenu_show.js"></script>
    <script type="module" src="/static/profile/scripts/usermenu/usermenu_create.js"></script>
	<script src="/static/profile/scripts/settings.js"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-[100vh] bg-[#212830] grid grid-rows-[auto_1fr_auto] m-[0]">
    <header class="h-[14vh] w-auto bg-[#151b23] text-[white] font-[JetBrains_Mono] row-[1] outline-[2px] outline-solid outline-[#333c46]" id="header">
        <a class="text-[5vh] text-[#d1d7e0] font-[JetBrains_Mono] m-[5px]" href="/">FlaBaxxit</a> <br>
    </header>
    <main class="w-[70vw] grid grid-rows-[auto_auto_auto_auto] text-[#d1d7e0] text-center font-[JetBrains_Mono] m-[5px] mr-auto ml-auto content-center justify-center justify-items-center" id="main">
        <div class="h-fit w-[65vw] bg-[#212121] m-[5px] rounded-[10px]" id="actions">
            <h2 class="h-[min-content] w-[65vw] bg-[#333c46] text-[4vh] rounded-[10px] ml-auto mr-auto outline-[3px] outline-solid outline-[#151b23]">Account info</h2>
            <h3 class="text-[3vh] m-[10px]">Change Username</h3>
            <p id="username"></p>
            <input class="w-[45vw] bg-[white] text-[black] rounded-[2px]" type="text" placeholder="Type a new username..." id="input_username">
            <p id="message_username"></p>
            <button class="w-fit bg-[white] text-[black] text-[JetBrains_Mono] rounded-[5px] m-[10px] p-[5px]" type="button" onclick="SendUpdateUsernameRequest()">Change Username</button>
            <h3 class="text-[3vh] m-[10px]">Change Bio</h3>
            <textarea class="w-[50vw] bg-[white] text-[black] resize-none rounded-[2px]" rows="15" cols="50" placeholder="Type a bio..." id="input_bio" rows="5" cols="30"></textarea> <br>
            <p id="message_bio"></p>
            <button class="w-fit bg-[white] text-[black] text-[JetBrains_Mono] rounded-[5px] m-[10px] p-[5px]" type="button" onclick="SendUpdateBioRequest()">Change bio</button>
            <h3 class="text-[3vh] m-[10px]">Change Password</h3>
            <p class="m-[5px]">Enter old password</p>
            <input class="w-[45vw] bg-[white] text-[black] rounded-[2px]" placeholder="Type a old password..." type="password" id="input_old_password">
            <p class="m-[5px]">Enter new password</p>
            <input class="w-[45vw] bg-[white] text-[black] rounded-[2px]" placeholder="Type a new password..." type="password" id="input_new_password"> <br>
            <p id="message_password"></p>
            <button class="w-fit bg-[white] text-[black] text-[JetBrains_Mono] rounded-[5px] m-[10px] p-[5px]" type="button" onclick="SendUpdatePasswordRequest()">Change password</button>
            <h3 class="text-[3vh] m-[10px]">Delete account</h3>
            <p id="message_delete"></p>
            <button class="w-fit bg-[white] text-[black] text-[JetBrains_Mono] rounded-[5px] m-[10px] p-[5px]" type="button" onclick="SendDeleteAccountRequest()">Delete account</button>

        </div>
    </main>
    <footer class="h-[10vh] w-auto row-[3] bg-[#212830] text-center font-[JetBrains_Mono]" id="footer">
        <div class="mr-auto flex flex-col">
            <a class="m-[5px] text-[#6f6f76]" href="/privacy">Privacy Policy</a>
            <a class="m-[5px] text-[#6f6f76]" href="/terms">Terms of use</a>
            <p class="text-[#6f6f76]">&copy; 2026 FlaBaxxit. All copyright reversed.</p>
        </div>
    </footer>

    <script>
      FetchUserInfo()
    </script>

</body>
</html>
