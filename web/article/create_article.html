<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Create Article</title>
	<meta name="description" content="Article creation page">
	<link rel="icon" type="image/png" href="/static/icons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg" />
    <link rel="shortcut icon" href="/static/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="FlaBaxxit" />
    <link rel="manifest" href="/static/icons/site.webmanifest" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
    @theme {
    --color-clifford: #da373d;
    }
    </style>
    <script src="/static/article/scripts/usermenu/usermenu_show.js"></script>
    <script src="/static/modules/theme/change_theme.js"></script>
    <script type="module" src="/static/modules/theme/check_theme.js"></script>
    <script type="module" src="/static/article/scripts/usermenu/usermenu_create.js"></script>
	<script src="/static/article/scripts/requests.js"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body class="min-h-[100vh] bg-[#f4f4eb] dark:bg-[#212830] grid grid-rows-[auto_1fr_auto] m-[0]">
    <header class="h-fit w-auto bg-[#f4f4eb] dark:bg-[#151b23] font-[JetBrains_Mono] row-[1] p-[5px] outline-[2px] outline-solid outline-[#333c46]" id="header">
        <div class="flex flex-row">
            <a class="text-[5vh] text-[black] dark:text-[#d1d7e0] font-[JetBrains_Mono] m-[5px]" href="/">FlaBaxxit</a> <br>
            <img src="/static/images/1.webp" alt="Logo" width="50">
            <button class="text-[black] dark:text-[gainsboro] ml-auto" type="button" id="change-theme_button" onclick="setTheme()">Change theme</button>
        </div>
    </header>
    <main class="w-[70vw] grid grid-rows-[auto_auto_auto_auto] text-[#d1d7e0] text-center font-[JetBrains_Mono] m-[10px] mr-auto ml-auto p-6 content-center justify-center justify-items-center" id="main">
        <div class="h-fit w-[85vw] bg-[#212121] rows-[1] rounded-[5px] outline-[1px]" id="editor">
            <h2 class="text-[4vh] m-[10px]">Create a new article</h2>
            <h3 class="text-[3vh] m-[10px]">Title</h3>
            <input class="w-[45vw] bg-[white] text-[black] rounded-[2px]" type="text" placeholder="Type a title of your thoughts" id="title"> <br>
            <h3 class="text-[3vh] m-[10px]">Content</h3>
            <textarea class="w-[50vw] bg-[white] text-[black] resize-none rounded-[2px]" id="content" rows="15" cols="50" placeholder="What's on your mind?"></textarea> <br>
            <button class="w-fit bg-[white] text-[black] text-[JetBrains_Mono] rounded-[5px] m-[10px] p-[5px]" type="button" onclick="SendCreateArticleRequest()">Post</button>
            <div class="cf-turnstile" id="turnstile-widget" data-sitekey="0x4AAAAAAD9i83m-xS3y164A" data-theme="dark"></div>
            <p id="status"></p>
        </div>
    </main>
    <footer class="h-[10vh] w-auto row-[3] bg-[#f4f4eb] dark:bg-[#212830] text-center font-[JetBrains_Mono]" id="footer">
        <div class="mr-auto flex flex-col">
            <a class="m-[5px] text-[#6f6f76]" href="/privacy-policy">Privacy Policy</a>
            <a class="m-[5px] text-[#6f6f76]" href="/terms-of-use">Terms of use</a>
            <a class="m-[5px] text-[#6f6f76]" href="/user-agreement">User agreement</a>
            <a class="m-[5px] ml-auto mr-auto" href="https://github.com/AsyncClyud/FlaBaxxit-mobile-app/releases/download/alpha/flabaxxit-v1.0.apk"><img src="/static/images/android.svg" alt="Logo"></a>
            <p class="text-[#6f6f76]">&copy; 2026 FlaBaxxit. All copyright reversed.</p>
        </div>
    </footer>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</body>
</html>
